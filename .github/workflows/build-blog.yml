# Rebuild blog from Notion on external trigger
name: Rebuild Blog from Notion

on:
  # Custom event dispatched from your backend
  repository_dispatch:
    types: [rebuild_from_notion]

  workflow_dispatch:

env:
  # Backend URL is needed by build‑time scripts that fetch from Notion
  BACKEND_URL: https://fxn-m-api.fxn-m.workers.dev

# Grant the minimum permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Prevent overlapping rebuilds
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🔧 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install dependencies
        run: bun ci

      - name: 🛠️ Build static website and blog (fetch from Notion ➜ static HTML)
        run: bun run build:markdown && bun run build

      - name: ⚙️  Configure Pages
        uses: actions/configure-pages@v6

      - name: 🗄️  Upload static artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
