name: Deploy Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Ensure queues exist
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler queues info fxn-m-enrichment >/dev/null 2>&1 ||
            bunx wrangler queues create fxn-m-enrichment
          bunx wrangler queues info fxn-m-enrichment-dlq >/dev/null 2>&1 ||
            bunx wrangler queues create fxn-m-enrichment-dlq

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
